  <div id="scene"></div>
  <noscript><p style="padding: 32px; font: 17px/1.5 system-ui, sans-serif;">La visite du Grand Zimbabwe a besoin de JavaScript et de WebGL pour s'afficher.</p></noscript>
  <script>
    // Si le script de la visite ne se charge pas (réseau, navigateur trop ancien), un message remplace l'écran vide.
    (function () {
      function secours() {
        if (document.querySelector('.hud') || document.getElementById('secours')) return;
        var p = document.createElement('p');
        p.id = 'secours';
        p.style.cssText = 'margin: 0; padding: 32px; max-width: 52ch; font: 17px/1.5 system-ui, sans-serif;';
        p.textContent = "La visite du Grand Zimbabwe n'a pas pu se charger. Rechargez la page, ou essayez un navigateur récent (Chrome, Edge, Firefox ou Safari).";
        document.body.appendChild(p);
      }
      addEventListener('error', function (e) { var t = e.target; if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) secours(); }, true);
      setTimeout(secours, 30000);
    })();
  </script>
